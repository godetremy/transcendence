$kind: http-request
name: Sign Up Agents
url: "{{baseUrl}}/auth/agents/signin"
method: POST
body:
  type: urlencoded
  content:
    - key: mail
      value: demo@bde.42angouleme.fr
      disabled: false
      description: Mail to use by the agent to login
    - key: password
      value: Demo1234*
      disabled: false
      description: Password in clear for the agent
examples: ./.resources/Sign Up Agents.resources/examples
order: 3000
