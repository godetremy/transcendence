$kind: http-example
request:
  url: "{{baseUrl}}/auth/agents/signin"
  method: POST
  body:
    type: urlencoded
    content:
      - key: mail
        value: demo@bde.42angouleme.fr
        description: Mail used by the agent to login
      - key: password
        value: BadPassword
        description: Password in clear of the agent
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Alt-Svc: h3=":443"; ma=2592000
    Content-Type: application/json
    Date: Wed, 10 Jun 2026 08:59:05 GMT
    Vary: rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch
    Via: 1.1 Caddy
    Transfer-Encoding: chunked
  body:
    type: json
    content: |-
      {
          "success": false,
          "message": "Invalid email or password"
      }
order: 1000
