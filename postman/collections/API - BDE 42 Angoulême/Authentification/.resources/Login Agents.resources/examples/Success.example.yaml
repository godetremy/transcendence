$kind: http-example
request:
  url: "{{baseUrl}}/auth/agents/signin"
  method: POST
  body:
    type: urlencoded
    content:
      - key: mail
        value: demo@bde.42angouleme.fr
        description: Mail used by the agent to login
      - key: password
        value: Demo1234*
        description: Password in clear of the agent
response:
  statusCode: 200
  statusText: OK
  headers:
    Alt-Svc: h3=":443"; ma=2592000
    Content-Type: application/json
    Date: Wed, 10 Jun 2026 09:04:26 GMT
    Vary: rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch
    Via: 1.1 Caddy
    Transfer-Encoding: chunked
  body:
    type: json
    content: |-
      {
          "success": true
      }
order: 2000
