name: trans-prod

services:
  nginx:
    ports:
      - '0.0.0.0:443:8080'
  node:
    build:
      target: prod
    volumes:
      - node_modules:/home/node/app/node_modules
    environment:
      NODE_ENV: production
    command: [ 'npm', 'run', 'start' ]

  vault:
    volumes:
      - vault_data:/vault/file

volumes:
  vault_data:
