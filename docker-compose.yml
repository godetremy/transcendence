name: trans

services:
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
        container_name: elasticsearch
        volumes:
            - ./docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
            - elastic_data:/usr/share/elasticsearch/data
            - ./docker/elasticsearch/certs:/usr/share/elasticsearch/config/certs:ro
        env_file: '.env'
        ports:
            - '127.0.0.1:9200:9200'
        networks:
            - elk
            - edge
        restart: on-failure
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -fsSk -u elastic:$$ELASTIC_PASSWORD https://127.0.0.1:9200/_cluster/health >/dev/null',
                ]
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 60s

    elk-bootstrap:
        image: curlimages/curl:8.12.1
        container_name: elk-bootstrap
        depends_on:
            elasticsearch:
                condition: service_healthy
        volumes:
            - ./docker/elasticsearch/bootstrap/01-retention.sh:/scripts/01-retention.sh:ro
        env_file: '.env'
        networks:
            - elk
        command:
            - |
                sh /scripts/01-retention.sh
                touch /tmp/retention.done
                while true; do sleep 3600; done
        entrypoint: ['/bin/sh', '-ec']
        restart: on-failure
        healthcheck:
            test: ['CMD-SHELL', 'test -f /tmp/retention.done']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 15s

    kibana:
        image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
        container_name: kibana
        depends_on:
            elasticsearch:
                condition: service_healthy
            elk-bootstrap:
                condition: service_healthy
        volumes:
            - ./docker/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
            - ./docker/kibana/bootstrap-kibana.sh:/scripts/bootstrap-kibana.sh:ro
        env_file: '.env'
        environment:
            ELASTICSEARCH_USERNAME: kibana_system
            ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
        ports:
            - '127.0.0.1:5601:5601'
        networks:
            - elk
            - edge
        command:
            - |
                sh /scripts/bootstrap-kibana.sh
        entrypoint: ['/bin/sh', '-ec']
        restart: on-failure
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:5601/api/status >/dev/null']
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 45s

    logstash:
        image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
        container_name: logstash
        depends_on:
            elasticsearch:
                condition: service_healthy
        volumes:
            - ./docker/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
            - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
        env_file: '.env'
        ports:
            - '127.0.0.1:5044:5044'
            - '127.0.0.1:9600:9600'
        networks:
            - elk
            - edge
        restart: on-failure
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9600 >/dev/null']
            interval: 30s
            timeout: 10s
            retries: 10
            start_period: 45s

    portainer:
        image: portainer/portainer-ce:sts
        container_name: portainer
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - portainer_data:/data
        ports:
            - '127.0.0.1:9443:9443'
        networks:
            - edge
        restart: on-failure
        healthcheck:
            test: ['CMD', '/portainer', '--version']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    postgres:
        image: postgres:17-alpine
        container_name: postgres
        volumes:
            - postgres_data:/var/lib/postgresql/data
        env_file: '.env'
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
        networks:
            - app
        restart: on-failure
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s

networks:
    edge:
        driver: bridge
    elk:
        driver: bridge
        internal: true
    app:
        driver: bridge
        internal: true

volumes:
    elastic_data:
    postgres_data:
    portainer_data:
