services:
    postgres:
        image: postgres:15-alpine
        container_name: $DB_NAME_POSTGRES
        environment:
            POSTGRES_USER: $USER_POSTGRES
            POSTGRES_PASSWORD: $PASSWORD_POSTGRES
            POSTGRES_DB: $DB_NAME_POSTGRES
        ports:
            - '$PORT_POSTGRES:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - main
        restart: on-failure
    caddy:
        image: caddy:alpine
        ports:
            - '443:443'
        volumes:
            - ./docker/Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - main
        extra_hosts:
            - "host.docker.internal:host-gateway"

volumes:
    postgres_data:
    caddy_data:
    caddy_config:

networks:
    main:
        driver: bridge
