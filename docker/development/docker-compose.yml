name: BDE-dev

services:
    elasticsearch:
        ports:
            - '127.0.0.1:9200:9200'
        env_file:
            - ./development/secrets/.env
    nginx:
        volumes:
            - ./development/certificates:/etc/nginx/certificates
        ports:
            - '127.0.0.1:80:80'
            - '127.0.0.1:443:443'
        env_file:
            - ./development/secrets/.env
        environment:
            NODE_UPSTREAM: host.docker.internal:3000
        develop:
            watch:
                - action: sync+exec
                  path: ./services/nginx/nginx.conf
                  target: /etc/nginx/templates/default.conf.template
                  exec:
                      command: /bin/sh -c "envsubst '$$NEXT_PUBLIC_BASE_URL $$NODE_UPSTREAM' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -s reload"
    postgres:
        env_file:
            - ./development/secrets/.env
        ports:
            - '127.0.0.1:$DATABASE_PORT:5432'
        restart: on-failure

    seaweed-filer:
        ports:
            - '127.0.0.1:8888:8888'

    seaweed-master:
        ports:
            - '127.0.0.1:9333:9333'

    seaweed-volume:
        ports:
            - '127.0.0.1:8080:8080'

    kibana:
        env_file:
            - ./development/secrets/.env

    logstash:
        env_file:
            - ./development/secrets/.env
