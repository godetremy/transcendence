name: BDE-dev

services:

    nginx:
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - ./development/certificates:/etc/nginx/certificates
            - ./development/services/nginx/nginx.conf:/etc/nginx/nginx.conf
        ports:
            - '80:80'
            - '443:443'
        develop:
            watch:
                - action: sync+exec
                  path: ./development/services/nginx/nginx.conf
                  target: /etc/nginx/nginx.conf
                  exec:
                      command: nginx -s reload
    postgres:
        env_file:
            - ./development/secrets/.env
        ports:
            - '$DATABASE_PORT:5432'
        networks:
            - app
        restart: on-failure
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 10s
            timeout: 5s
            retries: 5

    seaweed-master:
        ports:
            - '9333:9333'

    seaweed-filer:
        ports:
            - '8888:8888'

    seaweed-volume:
        ports:
            - '8080:8080'
