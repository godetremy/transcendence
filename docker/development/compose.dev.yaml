name: trans-dev

services:
    postgres:
        ports:
            - '${PORT_POSTGRES}:5432'

    nginx:
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - ./development/certificates:/etc/nginx/certificates
            - ./development/services/nginx/nginx.conf:/etc/nginx/nginx.conf
        ports:
            - '127.0.0.1:80:80'
            - '127.0.0.1:443:443'
        develop:
            watch:
                - action: sync+exec
                  path: ./development/services/nginx/nginx.conf
                  target: /etc/nginx/nginx.conf
                  exec:
                      command: nginx -s reload

    seaweed-master:
        ports:
            - '127.0.0.1:9333:9333'

    seaweed-filer:
        ports:
            - '127.0.0.1:8888:8888'

    seaweed-volume:
        ports:
            - '127.0.0.1:8080:8080'
