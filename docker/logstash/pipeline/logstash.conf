input {
	beats {
		port => 5044
		host => "0.0.0.0"
		ssl_enabled => true
		ssl_certificate => "/usr/share/logstash/config/certs/logstash.crt"
		ssl_key => "/usr/share/logstash/config/certs/logstash.key"
		ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
		ssl_client_authentication => "required"
	}
}

filter {
	# Try to parse structured JSON logs first (for app-level structured logging)
	json {
		source => "message"
		target => "app"
		skip_on_invalid_json => true
	}

	if [app] {
		# Map numeric Pino log levels to human-readable strings
		if [app][level] {
			translate {
				source => "[app][level]"
				target => "[app][level_label]"
				dictionary => {
					"10" => "TRACE"
					"20" => "DEBUG"
					"30" => "INFO"
					"40" => "WARN"
					"50" => "ERROR"
					"60" => "FATAL"
				}
				fallback => "UNKNOWN"
			}
		}
		# Parse timestamp if present
		if [app][time] {
			date {
				match => ["[app][time]", "UNIX_MS"]
				target => "@timestamp"
			}
		}
		# Extract service metadata
		if [app][service] {
			mutate { add_field => { "service" => "%{[app][service]}" } }
		}
		if [app][requestId] {
			mutate { add_field => { "request_id" => "%{[app][requestId]}" } }
		}
		if [app][eventType] {
			mutate { add_field => { "event_type" => "%{[app][eventType]}" } }
		}
		mutate { add_tag => ["structured"] }
	}

	# Fallback grok parsing for non-structured logs (raw container / file logs)
	if ![app] {
		if [service] == "nginx" and [log_type] == "access" {
			grok {
				match => { "message" => "%{COMBINEDAPACHELOG}" }
				tag_on_failure => ["_nginx_access_parse_failure"]
			}
			mutate {
				convert => { "response" => "integer" "bytes" => "integer" }
			}
		}

		if [service] == "nginx" and [log_type] == "error" {
			grok {
				match => { "message" => "%{DATESTAMP:nginx_timestamp} \[%{DATA:level}\] %{GREEDYDATA:error_message}" }
				tag_on_failure => ["_nginx_error_parse_failure"]
			}
			date {
				match => ["nginx_timestamp", "dd/MMM/yyyy:HH:mm:ss Z", "yyyy/MM/dd HH:mm:ss"]
				target => "timestamp"
				remove_field => ["nginx_timestamp"]
			}
		}

		if [service] == "modsecurity" {
			mutate {
				add_tag => ["waf"]
			}
		}

		if [service] == "postgres" {
			grok {
				match => { "message" => "%{TIMESTAMP_ISO8601:pg_timestamp} %{DATA:pg_timezone} \[%{NUMBER:pg_pid}\] %{DATA:pg_level}:  %{GREEDYDATA:pg_message}" }
				tag_on_failure => ["_postgres_parse_failure"]
			}
			date {
				match => ["pg_timestamp", "yyyy-MM-dd HH:mm:ss.SSS", "ISO8601"]
				target => "timestamp"
				remove_field => ["pg_timestamp"]
			}
		}

		if [service] == "nextjs" {
			grok {
				match => { "message" => "\[%{DATA:nextjs_level}\] %{GREEDYDATA:nextjs_message}" }
				tag_on_failure => ["_nextjs_parse_failure"]
			}
		}

		if [service] == "elasticsearch" and [log_type] == "container" {
			json {
				source => "message"
				target => "es"
				skip_on_invalid_json => true
			}
		}

		if [service] == "vault" or [service] == "vault-agent" {
			grok {
				match => { "message" => "%{TIMESTAMP_ISO8601:vault_timestamp} \[%{DATA:vault_level}\]%{SPACE}%{DATA:vault_component}: %{GREEDYDATA:vault_message}" }
				tag_on_failure => ["_vault_parse_failure"]
			}
			date {
				match => ["vault_timestamp", "ISO8601"]
				target => "timestamp"
				remove_field => ["vault_timestamp"]
			}
		}
	}

	# Normalize log level from various sources into a single field
	if [app][level_label] {
		mutate { add_field => { "log_level" => "%{[app][level_label]}" } }
	} else if [level] {
		mutate { add_field => { "log_level" => "%{level}" } }
	} else if [nextjs_level] {
		mutate { add_field => { "log_level" => "%{nextjs_level}" } }
	} else if [pg_level] {
		mutate { add_field => { "log_level" => "%{pg_level}" } }
	} else if [vault_level] {
		mutate { add_field => { "log_level" => "%{vault_level}" } }
	}

	# Ensure service field exists
	if ![service] {
		mutate { add_field => { "service" => "unknown" } }
	}
}

output {
	# Elastic Stack component logs → dedicated index for Stack Monitoring / discovery
	if [service] == "elasticsearch" or [service] == "kibana" or [service] == "logstash" {
		elasticsearch {
			hosts => ["https://elasticsearch:9200"]
			user => "${LOGSTASH_USERNAME}"
			password => "${LOGSTASH_PASSWORD}"
			ssl_enabled => true
			ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
			ssl_certificate => "/usr/share/logstash/config/certs/logstash.crt"
			ssl_key => "/usr/share/logstash/config/certs/logstash.key"

			index => "elastic-stack-logs"
			action => "create"
		}
	} else {
		# Application logs → main index
		elasticsearch {
			hosts => ["https://elasticsearch:9200"]
			user => "${LOGSTASH_USERNAME}"
			password => "${LOGSTASH_PASSWORD}"
			ssl_enabled => true
			ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
			# mTLS to Elasticsearch
			ssl_certificate => "/usr/share/logstash/config/certs/logstash.crt"
			ssl_key => "/usr/share/logstash/config/certs/logstash.key"

			# Single index alias with ILM rollover
			index => "transcendence"
			action => "create"
		}
	}
}
