# Logstash pipeline configuration

input {
  # Beats input (Filebeat, Metricbeat, etc.)
  beats {
    port => 5044
    host => "0.0.0.0"
  }

  # TCP input (optionnel)
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Ajouter des métadonnées
  mutate {
    add_field => { "[@metadata][version]" => "1.0" }
  }

  # Parser les timestamps si nécessaire
  if [@metadata][type] == "log" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:level}\] %{GREEDYDATA:log}" }
    }
  }
}

output {
  # Envoyer à Elasticsearch
  elasticsearch {
    hosts => [ "elasticsearch:9200" ]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "logs-%{+YYYY.MM.dd}"
  }

  # Afficher sur stdout (pour debug)
  stdout {
    codec => rubydebug
  }
}
