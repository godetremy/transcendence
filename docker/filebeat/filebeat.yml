filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      service: nginx
      log_type: access
    fields_under_root: true

  - type: log
    enabled: true
    paths:
      - /var/log/nginx/error.log
    fields:
      service: nginx
      log_type: error
    fields_under_root: true

  - type: log
    enabled: true
    paths:
      - /var/log/nginx/modsec_audit.log
    fields:
      service: modsecurity
      log_type: audit
    fields_under_root: true
    multiline:
      pattern: '^--[a-fA-F0-9]{8}-[A-Z]--$'
      negate: true
      match: after

filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      hints.default_config.enabled: true
      templates:
        - condition:
            contains:
              docker.container.name: elasticsearch
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: elasticsearch
                log_type: container
              fields_under_root: true

        - condition:
            contains:
              docker.container.name: kibana
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: kibana
                log_type: container
              fields_under_root: true

        - condition:
            contains:
              docker.container.name: logstash
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: logstash
                log_type: container
              fields_under_root: true

        - condition:
            contains:
              docker.container.name: node
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: nextjs
                log_type: container
              fields_under_root: true

        - condition:
            contains:
              docker.container.name: postgres
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: postgres
                log_type: container
              fields_under_root: true

        - condition:
            contains:
              docker.container.name: vault-agent
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: vault-agent
                log_type: container
              fields_under_root: true

        - condition:
            and:
              - contains:
                  docker.container.name: vault
              - not:
                  contains:
                    docker.container.name: vault-agent
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: vault
                log_type: container
              fields_under_root: true

        - condition:
            contains:
              docker.container.name: nginx
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: nginx-stdout
                log_type: container
              fields_under_root: true

        - condition:
            contains:
              docker.container.name: portainer
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: portainer
                log_type: container
              fields_under_root: true

        - condition:
            contains:
              docker.container.name: prometheus
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: prometheus
                log_type: container
              fields_under_root: true

        - condition:
            contains:
              docker.container.name: grafana
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                service: grafana
                log_type: container
              fields_under_root: true

output.logstash:
  hosts: ['logstash:5044']

logging.level: warning
logging.to_stderr: true
