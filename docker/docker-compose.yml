name: BDE

services:
    dicebear:
        image: dicebear/api:4
        environment:
            WEBP_SIZE_MAX: 512
        networks:
            - app
        restart: always
        tmpfs:
            - /run
            - /tmp

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        volumes:
            - ./services/elasticsearch/certs:/usr/share/elasticsearch/config/certs
            - elasticsearch_data:/usr/share/elasticsearch/data
            - ./services/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
            - ./services/elasticsearch/entrypoint.sh:/usr/share/elasticsearch/config/entrypoint.sh
        environment:
            ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        networks:
            - app
        entrypoint: ['bash', '/usr/share/elasticsearch/config/entrypoint.sh']
        restart: on-failure
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    "test -f /tmp/kibana-system-password-set && curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
                ]
            interval: 10s
            timeout: 10s
            retries: 120

    kibana:
        image: docker.elastic.co/kibana/kibana:8.15.3
        depends_on:
            elasticsearch:
                condition: service_healthy
        volumes:
            - ./services/elasticsearch/certs:/usr/share/kibana/config/certs
            - ./services/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
            - kibanadata:/usr/share/kibana/data
        networks:
            - app
        restart: on-failure
        healthcheck:
            test: ['CMD-SHELL', "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
            interval: 10s
            timeout: 10s
            retries: 120

    logstash:
        image: docker.elastic.co/logstash/logstash:8.15.3
        depends_on:
            elasticsearch:
                condition: service_healthy
            postgres:
                condition: service_healthy
        volumes:
            - ./services/elasticsearch/certs:/certs
            - ./services/logstash/events.conf:/usr/share/logstash/config/events.conf
            - ./services/logstash/events-mapping.json:/usr/share/logstash/config/events-mapping.json
            - ./services/logstash/entrypoint.sh:/usr/share/logstash/config/entrypoint.sh
            - ./services/logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml
            - ./services/logstash/logs.conf:/usr/share/logstash/config/logs.conf
            - ./services/logstash/logs-ilm-policy.json:/usr/share/logstash/config/logs-ilm-policy.json
            - ./services/logstash/logs-template.json:/usr/share/logstash/config/logs-template.json
        environment:
            XPACK_MONITORING_ENABLED: 'false'
        networks:
            - app
        entrypoint: ['bash', '/usr/share/logstash/config/entrypoint.sh']
        restart: on-failure
        user: '1000:0'

    filebeat:
        image: docker.elastic.co/beats/filebeat:8.15.3
        user: root
        command: ['--strict.perms=false']
        volumes:
            - ./services/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml
            - ./services/elasticsearch/certs:/certs
            - /var/lib/docker/containers:/var/lib/docker/containers
            - /var/run/docker.sock:/var/run/docker.sock
            - filebeat_data:/usr/share/filebeat/data
        depends_on:
            - logstash
        networks:
            - app
        restart: unless-stopped

    kibana-setup:
        image: curlimages/curl:8.11.1
        depends_on:
            kibana:
                condition: service_healthy
        volumes:
            - ./services/kibana/logs-dashboard.ndjson:/import/logs-dashboard.ndjson
            - ./services/kibana/entrypoint.sh:/import/entrypoint.sh
        environment:
            ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
        entrypoint: ['sh', '/import/entrypoint.sh']
        networks:
            - app
        restart: on-failure

    nginx:
        image: nginx:stable-alpine
        depends_on:
            - seaweed-filer
        volumes:
            - ./services/nginx/nginx.conf:/etc/nginx/templates/default.conf.template
        networks:
            - app
            - monitoring
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    postgres:
        image: postgres:15-alpine
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - app
        restart: always
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 10s
            timeout: 5s
            retries: 5

    seaweed-filer:
        image: chrislusf/seaweedfs:3.80
        depends_on:
            - seaweed-master
        networks:
            - app
        command: 'filer -master=seaweed-master:9333'

    seaweed-master:
        image: chrislusf/seaweedfs:3.80
        networks:
            - app
        command: 'master -ip=seaweed-master -port=9333'

    seaweed-volume:
        image: chrislusf/seaweedfs:3.80
        depends_on:
            - seaweed-master
        networks:
            - app
        command: 'volume -mserver=seaweed-master:9333 -ip=seaweed-volume -port=8080'

networks:
    app:
        driver: bridge
    monitoring:
        driver: bridge

volumes:
    postgres_data:
    elasticsearch_data:
    kibanadata:
    filebeat_data:
