services:
    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.49.1
        volumes:
            - /:/rootfs
            - /var/run:/var/run
            - /sys:/sys
            - /var/lib/docker/:/var/lib/docker
        networks:
            - monitoring
        restart: unless-stopped
        privileged: true
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/healthz']
            interval: 10s
            timeout: 5s
            retries: 10

    prometheus:
        image: prom/prometheus:v3.1.0
        volumes:
            - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - ./services/prometheus/alerts.yml:/etc/prometheus/alerts.yml
            - prometheus_data:/prometheus
        networks:
            - monitoring
            - app
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/healthy']
            interval: 10s
            timeout: 5s
            retries: 10

    grafana:
        image: grafana/grafana:11.4.0
        volumes:
            - grafana_data:/var/lib/grafana
            - ./services/grafana/provisioning:/etc/grafana/provisioning
            - ./services/grafana/dashboards:/var/lib/grafana/dashboards
        env_file:
            - ./monitoring/secrets/.env
        networks:
            - monitoring
            - app
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
            interval: 10s
            timeout: 5s
            retries: 10
    
    kibana:
        depends_on:
            elasticsearch:
                condition: service_healthy
        image: docker.elastic.co/kibana/kibana:9.4.4
        volumes:
            - certs:/usr/share/kibana/config/certs
            - ./services/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
            - kibana_data:/usr/share/kibana/data
        ports:
            - '5601:5601'
        networks:
            - monitoring
        restart: on-failure
        healthcheck:
            test: ['CMD-SHELL', "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
            interval: 10s
            timeout: 5s
            retries: 10

    logstash:
        depends_on:
            elasticsearch:
                condition: service_healthy
            kibana:
                condition: service_healthy
        image: docker.elastic.co/logstash/logstash:9.0.0
        volumes:
            - certs:/usr/share/logstash/certs
            - logstash_data:/usr/share/logstash/data
            - './logstash_ingest_data/:/usr/share/logstash/ingest_data/'
            - './services/logstash/logstash.conf:/usr/share/logstash/config/logstash.conf'
        environment:
            XPACK_MONITORING_ENABLED: 'false'
        networks:
            - monitoring
        restart: on-failure
        healthcheck:
            test: ['CMD-SHELL', 'curl -s -f http://localhost:9600 || exit 1']
            interval: 10s
            timeout: 5s
            retries: 10

    filebeat:
        depends_on:
            elasticsearch:
                condition: service_healthy
            kibana:
                condition: service_healthy
        image: docker.elastic.co/beats/filebeat:9.4.4
        user: root
        volumes:
            - certs:/usr/share/filebeat/certs
            - filebeat_data:/usr/share/filebeat/data
            - './filebeat_ingest_data/:/usr/share/filebeat/ingest_data/'
            - ./services/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml
            - /var/lib/docker/containers:/var/lib/docker/containers
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - monitoring
        restart: on-failure
        healthcheck:
            test: ['CMD-SHELL', 'filebeat test output']
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    monitoring:
        driver: bridge

volumes:
    prometheus_data:
        driver: local
    grafana_data:
        driver: local
    kibana_data:
        driver: local
    filebeat_data:
        driver: local
    logstash_data:
        driver: local
