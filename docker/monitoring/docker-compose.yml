services:
    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.49.1
        volumes:
            - /:/rootfs
            - /var/run:/var/run
            - /sys:/sys
            - /var/lib/docker/:/var/lib/docker
        networks:
            - monitoring
        restart: unless-stopped
        privileged: true
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/healthz']
            interval: 10s
            timeout: 5s
            retries: 10

    prometheus:
        image: prom/prometheus:v3.1.0
        volumes:
            - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - ./services/prometheus/alerts.yml:/etc/prometheus/alerts.yml
            - prometheus_data:/prometheus
        networks:
            - monitoring
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/healthy']
            interval: 10s
            timeout: 5s
            retries: 10

    grafana:
        image: grafana/grafana:11.4.0
        volumes:
            - grafana_data:/var/lib/grafana
            - ./services/grafana/provisioning:/etc/grafana/provisioning
            - ./services/grafana/dashboards:/var/lib/grafana/dashboards
        env_file:
            - ./monitoring/secrets/.env
        networks:
            - monitoring
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
            interval: 10s
            timeout: 5s
            retries: 10

networks:
    monitoring:
        driver: bridge

volumes:
    prometheus_data:
    grafana_data:
