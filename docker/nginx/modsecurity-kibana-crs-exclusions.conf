# Kibana-specific ModSecurity CRS exclusions
# The Next.js app cookie (and other cross-subdomain cookies) sent to kibana.localhost
# contain special characters that trigger false positives in SQLi cookie anomaly rules.
# This rule disables those specific CRS rules ONLY for Kibana requests,
# keeping ModSecurity fully active for all other traffic.
SecRule REQUEST_HEADERS:Host "@rx ^kibana\.localhost" \
    "id:1011,phase:1,pass,nolog,\
    ctl:ruleRemoveById=942420,\
    ctl:ruleRemoveById=942440"
