# ModSecurity Exclusions for Next.js / ft_transcendence App
# These rules prevent false positives on legitimate app traffic.

# -----------------------------------------------------------------------------
# 1. OAuth 42 Callback
# OAuth redirects carry URL-encoded state/code params that can trigger
# CRS rule 942100 (SQLi) or 941100 (XSS) on the query string.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /app/api/auth/oauth/fortytwo" \
    "id:1000,phase:2,pass,nolog,\
    ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/SQL_INJECTION,\
    ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/XSS"

# -----------------------------------------------------------------------------
# 2. Next.js WebSocket Hot Module Replacement (dev mode)
# WebSocket upgrade headers can trigger protocol anomaly rules.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /_next/webpack-hmr" \
    "id:1001,phase:1,pass,nolog,\
    ctl:ruleRemoveById=920280,\
    ctl:ruleRemoveById=920430"

# -----------------------------------------------------------------------------
# 3. JSON API Endpoints
# API routes sending/receiving JSON should not be inspected for SQLi/XSS
# in the request body (already handled by SecRequestBodyLimit).
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "id:1002,phase:1,pass,nolog,\
    ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/SQL_INJECTION,\
    ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/XSS,\
    ctl:ruleRemoveById=920420"

# -----------------------------------------------------------------------------
# 4. Static Assets (_next/static)
# Static files should not trigger any application-layer rules.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /_next/static" \
    "id:1003,phase:1,pass,nolog,\
    ctl:ruleRemoveById=920440,\
    ctl:ruleRemoveByTag=OWASP_CRS"

# -----------------------------------------------------------------------------
# 5. File Uploads (avatar/images)
# If your app allows file uploads, increase body limit for those routes
# and disable inspection on multipart bodies.
# Uncomment if you implement file uploads:
# -----------------------------------------------------------------------------
# SecRule REQUEST_URI "@beginsWith /app/api/upload" \
#     "id:1004,phase:1,pass,nolog,\
#     ctl:requestBodyLimit=10485760,\
#     ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/SQL_INJECTION,\
#     ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/XSS"

# -----------------------------------------------------------------------------
# 6. Allow legitimate HTTP methods for API
# Next.js API routes may use PATCH/DELETE which CRS sometimes restricts.
# -----------------------------------------------------------------------------
SecAction \
    "id:1005,phase:1,pass,nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# -----------------------------------------------------------------------------
# 7. Kibana internal security API
# Kibana sends URL-encoded values in JSON bodies (e.g. currentURL field),
# triggering false positives on login. Disable CRS for Kibana internal auth.
# Must run in phase:1 so ctl affects later phase rules.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /internal/security/" \
    "id:1010,phase:1,pass,nolog,\
    ctl:ruleRemoveByTag=OWASP_CRS"
