################################################################################
# ModSecurity Exclusions Configuration
# Application: ft_transcendence (Next.js)
# Purpose: Prevent false positives on legitimate application traffic
# Note: These rules are applied BEFORE core CRS rules in phase 1/2
################################################################################


################################################################################
# SECTION 1: AUTHENTICATION & OAUTH
################################################################################

# OAuth 42 School Callback
# Risk: URL-encoded state/code params trigger SQLi (942100) & XSS (941100) rules
# Action: Disable injection protections for OAuth redirect handling
SecRule REQUEST_URI "@beginsWith /app/api/auth/oauth/fortytwo" \
    "id:1000,phase:2,pass,nolog,\
    ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/SQL_INJECTION,\
    ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/XSS"


################################################################################
# SECTION 2: NEXT.JS DEVELOPMENT & INTERNAL ROUTES
################################################################################

# WebSocket Hot Module Replacement (HMR) - Next.js dev mode only
# Risk: WebSocket upgrade headers trigger protocol anomaly rules (920280, 920430)
# Action: Disable protocol rules for HMR connections
# Note: Disable this in production if dev mode is not used
SecRule REQUEST_URI "@beginsWith /_next/webpack-hmr" \
    "id:1001,phase:1,pass,nolog,\
    ctl:ruleRemoveById=920280,\
    ctl:ruleRemoveById=920430"

# Next.js Static Assets
# Risk: Static files can trigger app-layer rules unnecessarily
# Action: Whitelist all static assets from CRS inspection
SecRule REQUEST_URI "@beginsWith /_next/static" \
    "id:1003,phase:1,pass,nolog,\
    ctl:ruleRemoveByTag=OWASP_CRS"


################################################################################
# SECTION 3: API & JSON HANDLING
################################################################################

# JSON API Endpoints
# Risk: Valid JSON with special chars (quotes, operators) triggers SQLi/XSS rules
# Action: Disable injection checks for legitimate JSON content-type
# Note: Be cautious - this is permissive for all JSON; consider narrowing to specific endpoints
SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "id:1002,phase:1,pass,nolog,\
    ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/SQL_INJECTION,\
    ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/XSS,\
    ctl:ruleRemoveById=920420"

# Allow All HTTP Methods
# Risk: Next.js API routes use PATCH, DELETE, OPTIONS which CRS sometimes restricts
# Action: Explicitly allow modern REST methods
SecAction \
    "id:1005,phase:1,pass,nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"


################################################################################
# SECTION 4: FILE UPLOADS (OPTIONAL)
################################################################################

# Risk: Multipart bodies and binary content can trigger false positives
# Action: Increase body limit and disable injection checks for uploads

SecRule REQUEST_URI "@beginsWith /app/api/upload" \
    "id:1004,phase:1,pass,nolog,\
    ctl:requestBodyLimit=10485760,\
    ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/SQL_INJECTION,\
    ctl:ruleRemoveByTag=OWASP_CRS/WEB_ATTACK/XSS"


################################################################################
# SECTION 5: ELASTICSEARCH/KIBANA INTEGRATION
################################################################################

# Kibana Internal Security API
# Risk: Kibana sends URL-encoded values in JSON bodies (e.g., currentURL),
#       triggering false positives on login and auth endpoints
# Action: Disable CRS for Kibana internal authentication
# Note: Ensure phase:1 so ctl directives affect subsequent phases
SecRule REQUEST_URI "@beginsWith /internal/security/" \
    "id:1010,phase:1,pass,nolog,\
    ctl:ruleRemoveByTag=OWASP_CRS"


################################################################################
# CONFIGURATION NOTES
################################################################################
#
# IMPORTANT: Review these exclusions regularly
# ✓ Audit logs to confirm no actual attacks are bypassed
# ✓ Test with real user workflows to validate exceptions
# ✓ Restrict scope as much as possible (use specific URIs, not wildcards)
#
# RECOMMENDED HARDENING:
# - Replace rule 1002 (application/json) with specific endpoint rules
# - Remove rule 1001 (HMR) in production environments
# - Monitor ID logs for excluded rules to detect abuse patterns
#
# TESTING:
# Use curl to verify rules are applied:
#   curl -v "http://localhost/app/api/auth/oauth/fortytwo?code=test%27%20OR%201=1"
#
################################################################################