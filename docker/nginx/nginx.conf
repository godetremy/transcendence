load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	server_tokens off;

	log_format main '$remote_addr - $remote_user [$time_local] '
		'"$request" $status $body_bytes_sent '
		'"$http_referer" "$http_user_agent"';

	access_log /var/log/nginx/access.log main;
	error_log /var/log/nginx/error.log warn;

	client_max_body_size 1m;
	client_body_buffer_size 16k;
	large_client_header_buffers 4 8k;

	proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m;

	limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
	limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;

	upstream nextjs {
		server node:3000;
	}

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	upstream vault {
		server vault:8200;
	}

	server {
		listen 8080;
		server_name _;

		modsecurity on;
		modsecurity_rules_file /etc/modsecurity.d/setup.conf;

		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'self';" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

		location / {
			limit_req zone=api_limit burst=20 nodelay;
			proxy_pass http://nextjs;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_read_timeout 60s;
		}

		location /_next/webpack-hmr {
			proxy_pass http://nextjs;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
			proxy_read_timeout 86400;
		}

		location /app/login {
			limit_req zone=login_limit burst=5 nodelay;
			proxy_pass http://nextjs;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /app/api/auth {
			limit_req zone=login_limit burst=5 nodelay;
			proxy_pass http://nextjs;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /_next/static/ {
			proxy_pass http://nextjs;
			proxy_set_header Host $host;
			proxy_cache static_cache;
			proxy_cache_valid 200 60m;
		}

		location = /robots.txt {
			return 200 "User-agent: *\nDisallow: /api/\n";
			add_header Content-Type text/plain;
		}

		location = /stub_status {
			stub_status;
			allow 10.0.0.0/8;
			allow 172.16.0.0/12;
			allow 192.168.0.0/16;
			deny all;
		}
	}

	server {
		listen 8080;
		server_name vault.localhost;

		modsecurity off;

		location / {
			proxy_pass http://vault;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $host;
			proxy_read_timeout 300s;
			proxy_send_timeout 300s;
		}
	}
}
