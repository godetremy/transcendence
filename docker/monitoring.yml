services:
    nginx:
        networks:
            - monitoring

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.49.1
        volumes:
            - /:/rootfs
            - /var/run:/var/run
            - /sys:/sys
            - /var/lib/docker/:/var/lib/docker
        networks:
            - monitoring
        restart: unless-stopped
        privileged: true

    node-exporter:
        image: quay.io/prometheus/node-exporter:v1.8.2
        volumes:
            - /:/host
        networks:
            - monitoring
        command:
            - '--path.rootfs=/host'
        restart: unless-stopped
        pid: host

    postgres-exporter:
        image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
        environment:
            DATA_SOURCE_NAME: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable'
        networks:
            - monitoring
            - app
        restart: unless-stopped

    elasticsearch-exporter:
        image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.7.0
        volumes:
            - ./services/elasticsearch/certs:/certs
        environment:
            ES_USERNAME: elastic
            ES_PASSWORD: ${ELASTIC_PASSWORD}
        networks:
            - monitoring
            - app
        command:
            - '--es.uri=https://elasticsearch:9200'
            - '--es.ca=/certs/ca/ca.crt'
            - '--es.all'
            - '--es.indices'
        restart: unless-stopped
        user: '1000:0'

    nginx-exporter:
        image: nginx/nginx-prometheus-exporter:1.4.0
        networks:
            - monitoring
            - app
        command:
            - '--nginx.scrape-uri=http://nginx:8081/stub_status'
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:v3.1.0
        volumes:
            - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - ./services/prometheus/alerts.yml:/etc/prometheus/alerts.yml
            - prometheus_data:/prometheus
        networks:
            - monitoring
        restart: unless-stopped

    grafana:
        image: grafana/grafana:11.4.0
        volumes:
            - grafana_data:/var/lib/grafana
            - ./services/grafana/provisioning:/etc/grafana/provisioning
            - ./services/grafana/dashboards:/var/lib/grafana/dashboards
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
            GF_SERVER_ROOT_URL: https://grafana.${NEXT_PUBLIC_BASE_URL}
            GF_USERS_ALLOW_SIGN_UP: 'false'
            GF_AUTH_ANONYMOUS_ENABLED: 'false'
        networks:
            - monitoring
        restart: unless-stopped

networks:
    monitoring:
        driver: bridge

volumes:
    prometheus_data:
    grafana_data:
