input {
	jdbc {
		jdbc_driver_library => "/usr/share/logstash/drivers/postgresql.jar"
		jdbc_driver_class => "org.postgresql.Driver"
		jdbc_connection_string => "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
		jdbc_user => "${POSTGRES_USER}"
		jdbc_password => "${POSTGRES_PASSWORD}"
		schedule => "*/1 * * * *"
		statement => "SELECT id, organization_id, title, subtitle, description, location, start_at, end_at, created_at, update_at FROM events"
	}
}

output {
	elasticsearch {
		hosts => ["https://elasticsearch:9200"]
		index => "events"
		document_id => "%{id}"
		user => "elastic"
		password => "${ELASTIC_PASSWORD}"
		ssl_enabled => true
		ssl_certificate_authorities => ["/certs/ca/ca.crt"]
		manage_template => false
	}
}
