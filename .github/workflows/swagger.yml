name: swagger.yml
on:
    push:
        branches:
            - main
            - feature/web-71-install-swagger-on-gh-pages-for-api-docs

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    swagger:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Jq
              run: sudo apt-get update && sudo apt-get install -y jq

            - name: Download latest Swagger UI
              run: |
                RELEASE_TAG=$(curl https://api.github.com/repos/swagger-api/swagger-ui/releases/latest | jq -r ".tag_name")
                VERSION=${RELEASE_TAG:1}
    
                wget https://github.com/swagger-api/swagger-ui/archive/refs/tags/$RELEASE_TAG.tar.gz -O swagger.tar
    
                tar -xzf swagger.tar "swagger-ui-$VERSION/dist/"
                mv "swagger-ui-$VERSION/dist/" "swagger"
                rm -rf swagger.tar "swagger-ui-$VERSION"

            - name: Configure Swagger UI
              run: |
                  cp "swagger.config.js" "swagger/swagger-initializer.js"
                  cp "swagger.json" "swagger/swagger.json"

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                path: swagger