name: trans-dev

services:
    nginx:
        environment:
            NGINX_SSL: '1'
        ports:
            - '127.0.0.1:443:443'

    node:
        build:
            target: dev
        volumes:
            - ./:/home/node/app
            - node_modules:/home/node/app/node_modules
        environment:
            NODE_ENV: development
            # the rest (db url, base url, client id) comes from the base compose
            OAUTH_42_SECRET: ${OAUTH_42_SECRET}
            SESSION_SECRET: ${SESSION_SECRET}
        command: npm run dev

    vault:
        # don't override the command here — we need the full dev args from the base file

networks:
    app:
        internal: false
