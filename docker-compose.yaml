name: trans

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    container_name: elasticsearch
    volumes:
      - ./docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - elastic_data:/usr/share/elasticsearch/data
      - ./docker/elasticsearch/bootstrap:/scripts:ro
      - ./docker/elasticsearch/certs:/usr/share/elasticsearch/config/certs
    environment:
      ELASTIC_USERNAME: ${ELASTIC_USERNAME}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTIC_CERT_PASSWORD: ${ELASTIC_CERT_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    networks:
      - elk
    entrypoint:
      - /bin/bash
      - -c
      - |
        bash /scripts/00-generate-certs.sh
        chown -R 1000:0 /usr/share/elasticsearch/data /usr/share/elasticsearch/config/certs /usr/share/elasticsearch/logs
        su elasticsearch -s /bin/bash -c 'export PATH="/usr/share/elasticsearch/bin:$$PATH" && /usr/local/bin/docker-entrypoint.sh elasticsearch' &
        ES_PID=$$!
        until curl -fsSk -u "$$ELASTIC_USERNAME:$$ELASTIC_PASSWORD" https://127.0.0.1:9200/_cluster/health >/dev/null 2>&1; do
          sleep 2
        done
        bash /scripts/01-retention.sh
        wait $$ES_PID
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -fsSk -u $$ELASTIC_USERNAME:$$ELASTIC_PASSWORD https://127.0.0.1:9200/_cluster/health >/dev/null' ]
      timeout: 5s
      retries: 5
      start_period: 20s
    user: '0:0'
    mem_limit: 3g

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION}
    container_name: filebeat
    depends_on:
      logstash:
        condition: service_healthy
    volumes:
      - ./docker/filebeat/filebeat.yml:/tmp/filebeat.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - filebeat_data:/usr/share/filebeat/data
    networks:
      - elk
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /tmp/filebeat.yml /usr/share/filebeat/filebeat.yml
        chown root:root /usr/share/filebeat/filebeat.yml
        chmod 0644 /usr/share/filebeat/filebeat.yml
        exec filebeat -e
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'filebeat test output 2>/dev/null | grep -q "logstash" || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    user: root
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    networks:
      - monitoring
      - edge
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1' ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./docker/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./docker/kibana/certs:/usr/share/kibana/config/certs:rw
      - ./docker/kibana/bootstrap/generate-kibana-certs.sh:/usr/share/kibana/config/bootstrap-generate-kibana-certs.sh:ro
      - ./docker/elasticsearch/certs:/usr/share/elasticsearch/config/certs:ro
    environment:
      KIBANA_SYSTEM_USERNAME: ${KIBANA_SYSTEM_USERNAME}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      KIBANA_ENCRYPTION_KEY: ${KIBANA_ENCRYPTION_KEY}
      KIBANA_REPORTING_ENCRYPTION_KEY: ${KIBANA_REPORTING_ENCRYPTION_KEY}
      KIBANA_SECURITY_ENCRYPTION_KEY: ${KIBANA_SECURITY_ENCRYPTION_KEY}
      ELASTIC_CERT_PASSWORD: ${ELASTIC_CERT_PASSWORD}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTIC_USERNAME: ${ELASTIC_USERNAME}
    networks:
      - elk
      - edge
    entrypoint: [ "/bin/sh", "-c", "/usr/share/kibana/config/bootstrap-generate-kibana-certs.sh && /usr/local/bin/kibana-docker" ]
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -kfsS https://127.0.0.1:5601/api/status >/dev/null' ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 100s
    user: '1000:0'
    mem_limit: 768m

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    container_name: logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./docker/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      LOGSTASH_USERNAME: ${LOGSTASH_USERNAME}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD}
    networks:
      - elk
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -fsS http://127.0.0.1:9600 >/dev/null' ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 1g

  nginx:
    image: owasp/modsecurity-crs:nginx
    container_name: nginx
    depends_on:
      node:
        condition: service_healthy
    volumes:
      - ./docker/nginx/nginx.conf:/opt/custom/nginx.conf:ro
      - ./docker/nginx/modsecurity.conf:/opt/custom/modsecurity.conf:ro
      - ./docker/nginx/crs-setup.conf:/opt/custom/crs-setup.conf:ro
      - nginx_logs:/var/log/nginx
    ports:
      - '127.0.0.1:8080:8080'
    networks:
      - app
      - edge
      - vault_net
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /opt/custom/modsecurity.conf /etc/nginx/modsecurity.d/modsecurity-override.conf
        cp /opt/custom/crs-setup.conf /etc/modsecurity.d/owasp-crs/crs-setup.conf.example
        /docker-entrypoint.sh nginx -version
        cp /opt/custom/nginx.conf /etc/nginx/nginx.conf
        exec nginx -g "daemon off;"
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1' ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: ${NODE_TARGET:-dev}
    container_name: node
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/home/node/app
      - node_modules:/home/node/app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV}
    networks:
      - app
      - edge
    working_dir: /home/node/app
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1' ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  portainer:
    image: portainer/portainer-ce:sts
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - '127.0.0.1:9443:9443'
    networks:
      - edge
    restart: on-failure
    healthcheck:
      test: [ 'CMD', '/portainer', '--version' ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${PGDATA}
    networks:
      - app
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB' ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    shm_size: 128m

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - app
      - elk
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=256MB'
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null 2>&1' ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_API_ADDR: ${VAULT_API_ADDR}
    ports:
      - '127.0.0.1:8200:8200'
    networks:
      - vault_net
    command:
      - server
      - -dev
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1' ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    cap_add:
      - IPC_LOCK
    mem_limit: 1g

  vault-agent:
    image: hashicorp/vault:1.17
    container_name: vault-agent
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./docker/vault-agent/agent.hcl:/etc/vault/agent.hcl:ro
      - ./docker/vault-agent/bootstrap-vault-agent.sh:/scripts/bootstrap-vault-agent.sh:ro
      - ./docker/vault-agent/templates:/etc/vault/templates:ro
      - vault_agent_data:/vault/agent
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_APP_SECRET: ${VAULT_APP_SECRET}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_ENCRYPTION_KEY: ${KIBANA_ENCRYPTION_KEY}
    networks:
      - vault_net
    command: sh -c 'sh /scripts/bootstrap-vault-agent.sh'
    restart: on-failure
    healthcheck:
      test: [ 'CMD-SHELL', 'test -f /vault/agent/rendered/app-config.env' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m

networks:
  edge:
    driver: bridge
  elk:
    driver: bridge
    internal: true
  app:
    driver: bridge
    internal: true
  vault_net:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge
    internal: true

volumes:
  elastic_data:
  postgres_data:
  portainer_data:
  vault_agent_data:
  node_modules:
  nginx_logs:
  filebeat_data:
  prometheus_data:
  grafana_data:
