services:
  prometheus:
    container_name: dockerconfig-prometheus
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-3d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --query.max-concurrency=${PROMETHEUS_QUERY_MAX_CONCURRENCY:-4}
      - --query.timeout=${PROMETHEUS_QUERY_TIMEOUT:-2m}
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    restart: on-failure
    mem_limit: 512m
    cpus: "0.50"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitoring
      - edge

  grafana:
    container_name: dockerconfig-grafana
    image: grafana/grafana:11.5.1
    ports:
      - "3000:3000"
    restart: on-failure
    mem_limit: 256m
    cpus: "0.25"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./docker/grafana/dashboards/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./docker/grafana/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitoring
      - edge

  node-exporter:
    container_name: dockerconfig-node-exporter
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    restart: on-failure
    mem_limit: 128m
    cpus: "0.25"
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitoring

  cadvisor:
    container_name: dockerconfig-cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: on-failure
    mem_limit: 256m
    cpus: "0.50"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitoring

  elasticsearch:
    container_name: dockerconfig-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    restart: on-failure
    mem_limit: 1g
    cpus: "1.00"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
    ports:
      - "9200:9200"
    volumes:
      - ./docker/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - elk
      - edge

  elk-bootstrap:
    container_name: dockerconfig-elk-bootstrap
    image: curlimages/curl:8.12.1
    restart: on-failure
    mem_limit: 64m
    cpus: "0.10"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sh /scripts/01-retention.sh
        touch /tmp/retention.done
        while true; do sleep 3600; done
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./docker/elasticsearch/bootstrap/01-retention.sh:/scripts/01-retention.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/retention.done"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk

  logstash:
    container_name: dockerconfig-logstash
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    restart: on-failure
    mem_limit: 512m
    cpus: "0.50"
    environment:
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      LS_JAVA_OPTS: ${LS_JAVA_OPTS}
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./docker/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9600 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk
      - edge

  kibana:
    container_name: dockerconfig-kibana
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    restart: on-failure
    mem_limit: 1g
    cpus: "0.50"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_ENCRYPTION_KEY: ${KIBANA_ENCRYPTION_KEY}
      NODE_OPTIONS: ${KIBANA_NODE_OPTIONS:---max-old-space-size=768}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sh /scripts/bootstrap-kibana.sh
    ports:
      - "5601:5601"
    volumes:
      - ./docker/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./docker/kibana/bootstrap-kibana.sh:/scripts/bootstrap-kibana.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk
      - edge

  vault:
    container_name: dockerconfig-vault
    image: hashicorp/vault:1.17
    restart: on-failure
    mem_limit: 256m
    cpus: "0.25"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: ${VAULT_DEV_LISTEN_ADDRESS}
    command:
      - server
      - -dev
      - -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID}
      - -dev-listen-address=${VAULT_DEV_LISTEN_ADDRESS}
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vault_net
      - edge

  vault-agent:
    container_name: dockerconfig-vault-agent
    image: hashicorp/vault:1.17
    restart: on-failure
    mem_limit: 192m
    cpus: "0.25"
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_APP_SECRET: ${VAULT_APP_SECRET}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      KIBANA_ENCRYPTION_KEY: ${KIBANA_ENCRYPTION_KEY}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sh /scripts/bootstrap-vault-agent.sh
    volumes:
      - ./docker/vault-agent/agent.hcl:/etc/vault/agent.hcl:ro
      - ./docker/vault-agent/templates/app-config.ctmpl:/etc/vault/templates/app-config.ctmpl:ro
      - ./docker/vault-agent/bootstrap-vault-agent.sh:/scripts/bootstrap-vault-agent.sh:ro
      - vault_agent_data:/vault/agent
    healthcheck:
      test: ["CMD-SHELL", "test -s /vault/agent/token/agent.token"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - vault_net

  postgres:
    container_name: dockerconfig-postgres
    image: postgres:17-alpine
    restart: on-failure
    mem_limit: 512m
    cpus: "0.50"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app

  prisma:
    container_name: dockerconfig-prisma
    image: node:24-alpine
    user: node
    working_dir: /home/node/app
    restart: on-failure
    mem_limit: 192m
    cpus: "0.25"
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    volumes:
      - ./:/home/node/app
    command:
      - sh
      - -c
      - tail -f /dev/null
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  node:
    container_name: dockerconfig-node
    image: node:24-alpine
    user: node
    working_dir: /home/node/app
    restart: on-failure
    mem_limit: 192m
    cpus: "0.25"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${NODE_PORT}
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    volumes:
      - ./docker/node:/home/node/app:ro
    command:
      - node
      - server.js
    ports:
      - "${NODE_PORT}:${NODE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - monitoring
      - edge

  nginx:
    container_name: dockerconfig-nginx
    image: owasp/modsecurity-crs:nginx
    restart: on-failure
    mem_limit: 256m
    cpus: "0.50"
    ports:
      - "8080:8080"
    environment:
      PROXY: ${NGINX_PROXY}
      BACKEND: ${NGINX_BACKEND}
      PARANOIA: ${NGINX_PARANOIA}
      ANOMALY_INBOUND: ${NGINX_ANOMALY_INBOUND}
      ANOMALY_OUTBOUND: ${NGINX_ANOMALY_OUTBOUND}
    depends_on:
      node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app
      - edge

  portainer:
    container_name: dockerconfig-portainer
    image: portainer/portainer-ce:sts
    restart: on-failure
    mem_limit: 384m
    cpus: "0.50"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9443:9443"
    healthcheck:
      test: ["CMD", "/portainer", "--help"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - edge

volumes:
  elastic_data:
  grafana_data:
  postgres_data:
  portainer_data:
  prom_data:
  vault_agent_data:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge
    internal: true
  elk:
    driver: bridge
    internal: true
  vault_net:
    driver: bridge
    internal: true
