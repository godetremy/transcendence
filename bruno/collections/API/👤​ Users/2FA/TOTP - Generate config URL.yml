info:
    name: TOTP - Generate config URL
    type: http
    seq: 2

http:
    method: GET
    url: '{{BaseURL}}/users/:id/2fa/configure/totp'
    params:
        - name: id
          value: me
          type: path
    auth: inherit

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
