info:
  name: TOTP - Toggle TOTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{BaseURL}}/users/:id/2fa/configure/totp"
  params:
    - name: ""
      value: ""
      type: query
    - name: id
      value: me
      type: path
  body:
    type: json
    data: |-
      {
        "code": "111111",
        "enable": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
