info:
  name: Forgot Password - Change password with token
  type: http
  seq: 6

http:
  method: PUT
  url: "{{BaseURL}}/auth/forgot-password"
  body:
    type: form-urlencoded
    data:
      - name: token
        value: test
      - name: password
        value: test.123
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
