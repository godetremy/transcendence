info:
  name: Forgot Password - Check token
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseURL}}/auth/forgot-password?token=test"
  params:
    - name: token
      value: test
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
