info:
  name: Upload an image for a specified event
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/events/:event_id/photos/download"
  params:
    - name: event_id
      value: idtest
      type: path
  body:
    type: json
    data: |-
      {
        "formData": "photo.img"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
