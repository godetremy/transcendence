info:
  name: Get all events between two dates
  type: http
  seq: 2

http:
  method: GET
  url: "{{BaseURL}}/events?from=06/11/2026&to=06/11/2026&limit=20"
  params:
    - name: from
      value: 06/11/2026
      type: query
    - name: to
      value: 06/11/2026
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
