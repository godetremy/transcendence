info:
  name: list user
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseURL}}/organization/:org_id/users?limit=10&q=em&page=1"
  params:
    - name: limit
      value: "10"
      type: query
    - name: q
      value: em
      type: query
    - name: page
      value: "1"
      type: query
    - name: org_id
      value: f9f9ada4-ae38-40df-8bfa-01eeddff8641
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
