info:
  name: Invitation - List of invitation to organization
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseURL}}/organization/invitation/pending?limit=20&page=1"
  params:
    - name: limit
      value: "20"
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
