info:
  name: Users - Lists users
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseURL}}/organization/:org_id/users?page=1&limit=10&register=true&q=test"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: register
      value: "true"
      type: query
    - name: q
      value: test
      type: query
    - name: org_id
      value: cd7197db-eb46-490c-bcd0-043d48bbd46f
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
