info:
  name: Export - export event
  type: http
  seq: 3

http:
  method: POST
  url: "{{BaseURL}}/organization/:org_id/services"
  params:
    - name: org_id
      value: test
      type: path
  body:
    type: form-urlencoded
    data:
      - name: type
        value: csv
      - name: filename
        value: test.csv
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
